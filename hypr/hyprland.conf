#Let's Go!!!!!!!!!!!!!

monitor=,preferred,auto,1

$terminal = kitty
$browser = firefox
$fileManager = nautilus
$menu = tofi-drun -c ~/.config/tofi/configV --drun-launch=true
$colorPicker = hyprpicker

#StartUp
exec-once = /usr/lib/polkit-kde-authentication-agent-1 # Polkit for privilege management
exec-once = /usr/bin/dunst
exec-once = hyprpaper 
exec-once = waybar 
exec-once = blueman-applet 
exec-once = nm-applet 
exec-once = ~/.config/hypr/scripts/connect_wifi.sh
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = swww-daemon
exec-once = swww img ~/Pictures/wallpapers/a_tower_on_a_small_island.jpg  --transition-fps 255 --transition-type outer --transition-duration 0.5


# QT
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = QT_STYLE_OVERRIDE,kvantum

# Toolkit Backend Variables
env = GDK_BACKEND,wayland,x11,*
env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland

# XDG Specifications
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

env = XCURSOR_THEME, catppuccin-mocha-rosewater-cursors
env = XCURSOR_SIZE, 24


input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0.12

    touchpad {
        natural_scroll = true
    }
}

gesture = 3, horizontal, workspace , scale: 1

dwindle {
    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
}

misc { 
    force_default_wallpaper = 0 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = true # If true disables the random hyprland logo / anime girl background. :(
    disable_splash_rendering = true
    vrr = 0
}


general { 
    gaps_in = 5
    gaps_out = 5
    border_size = 2
    col.active_border = rgb(8aadf4) rgb(24273A) rgb(24273A) rgb(8aadf4) 45deg
    col.inactive_border = rgb(24273A) rgb(24273A) rgb(24273A) rgb(27273A) 45deg
    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

animations {
    enabled = true
    bezier = wind, 0.05, 0.9, 0.1, 1.05
    bezier = winIn, 0.1, 1.1, 0.1, 1.1
    bezier = winOut, 0.3, -0.3, 0, 1
    bezier = liner, 1, 1, 1, 1
    animation = windows, 1, 6, wind, slide
    animation = windowsIn, 1, 6, winIn, slide
    animation = windowsOut, 1, 5, winOut, slide
    animation = windowsMove, 1, 5, wind, slide
    animation = border, 1, 1, liner
    animation = borderangle, 1, 30, liner, loop
    animation = fade, 1, 10, default
    animation = workspaces, 1, 5, wind
}

decoration {
    rounding = 10

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow{
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }
    
    blur {
        enabled = true
        size = 3
        passes = 3
        new_optimizations = true
        vibrancy = 0.1696
        ignore_opacity = true
    }
}

##KeyBinds
$mainMod = ALT
bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, L, exit,
bind = $mainMod, W, killactive,
bind = $mainMod, SPACE, exec, $menu
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, F, exec, env XCURSOR_THEME=catppuccin-mocha-rosewater-cursors XCURSOR_SIZE=24 MOZ_ENABLE_WAYLAND=1 $browser
bind = $mainMod, M, exec, ~/.config/waybar/scripts/launch.sh
bind = $mainMod, I, exec, ~/Downloads/intellij/bin/idea.sh
bind = SUPER, V, exec, cliphist list | tofi -c ~/.config/tofi/configV | cliphist decode | wl-copy
bind = $mainMod, S, exec, ~/.config/waybar/scripts/wallpaper.sh
bind = SUPER, P, exec, $colorPicker | wl-copy # Also copies to clipboard
bind = SUPER, L, exec, hyprlock
bind = SUPER, ESCAPE, exec, wlogout
bind = $mainMod, M, exec, spotify

binde = $mainMod+Shift, Right, resizeactive, 30 0
binde = $mainMod+Shift, Left, resizeactive, -30 0
binde = $mainMod+Shift, Up, resizeactive, 0 -30
binde = $mainMod+Shift, Down, resizeactive, 0 30

bindm = $mainMod, Z, movewindow
bindm = $mainMod, X, resizewindow

bind = SUPER, E, exec, rofimoji | wl-copy

# Entire screen + clipboard copy
bind = , Print, exec, grimblast --notify copysave screen "$HOME/Pictures/Screenshots/$(date +%Y-%m-%d_%H-%M-%S).png" 

# current Active window only + clipboard copy
bind = $mainMod, Print, exec, grimblast --notify copysave active "$HOME/Pictures/Screenshots/$(date +%Y-%m-%d_%H-%M-%S).png"

# Select area to take screenshot
bind = $mainMod, G, exec, grimblast --notify copysave area "$HOME/Pictures/Screenshots/$(date +%Y-%m-%d_%H-%M-%S).png"

bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = $mainMod, 1, workspace,1
bind = $mainMod, 2, workspace,2
bind = $mainMod, 3, workspace,3
bind = $mainMod, 4, workspace,4
bind = $mainMod, 5, workspace,5

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5

bind = , XF86AudioRaiseVolume, exec, pamixer -i 5 
bind = , XF86AudioLowerVolume, exec, pamixer -d 5 
bind = , XF86AudioMicMute, exec, pamixer --default-source -m
bind = , XF86AudioMute, exec, pamixer -t
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioPause, exec, playerctl play-pause
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous

bind = , XF86MonBrightnessUp, exec, brightnessctl s +5%
bind = , XF86MonBrightnessDown, exec, brightnessctl s 5%-



##Windows Rules

############################
# OPACITY RULES
############################

# Browsers & editors
windowrule = match:class ^thorium-browser$, opacity 0.90 0.90
windowrule = match:class ^Code$, opacity 0.80 0.80
windowrule = match:class ^code-url-handler$, opacity 0.80 0.80
windowrule = match:class ^code-insiders-url-handler$, opacity 0.80 0.80

# Development tools
windowrule = match:class ^arduino-ide$, opacity 0.80 0.80
windowrule = match:class ^dev\.warp\.Warp$, opacity 0.80 0.80
windowrule = match:class ^kitty$, opacity 0.80 0.80

# File managers & appearance tools
windowrule = match:class ^org\.gnome\.Nautilus$, opacity 0.80 0.80
windowrule = match:class ^org\.kde\.ark$, opacity 0.80 0.80
windowrule = match:class ^nwg-look$, opacity 0.80 0.80
windowrule = match:class ^qt5ct$, opacity 0.80 0.80
windowrule = match:class ^qt6ct$, opacity 0.80 0.80
windowrule = match:class ^kvantummanager$, opacity 0.80 0.80

# Audio / Bluetooth / Network dialogs
windowrule = match:class ^pavucontrol$, opacity 0.80 0.70
windowrule = match:class ^blueman-manager$, opacity 0.80 0.70
windowrule = match:class ^nm-connection-editor$, opacity 0.80 0.70

# Auth agents & portals (only apply if they spawn real windows)
windowrule = match:class ^polkit-gnome-authentication-agent-1$, opacity 0.80 0.70
windowrule = match:class ^org\.kde\.polkit-kde-authentication-agent-1$, opacity 0.80 0.70
windowrule = match:class ^org\.freedesktop\.impl\.portal\., opacity 0.80 0.70

# Spotify
windowrule = match:class ^Spotify$, opacity 0.80 0.80
windowrule = match:title ^Spotify Free$, opacity 0.70 0.70


############################
# FLOAT RULES
############################

windowrule = match:class ^kvantummanager$, float on
windowrule = match:class ^qt5ct$, float on
windowrule = match:class ^qt6ct$, float on
windowrule = match:class ^nwg-look$, float on
windowrule = match:class ^org\.kde\.ark$, float on
windowrule = match:class ^pavucontrol$, float on
windowrule = match:class ^blueman-manager$, float on
windowrule = match:class ^nm-connection-editor$, float on
windowrule = match:class ^polkit-gnome-authentication-agent-1$, float on
windowrule = match:class ^rofimoji$, float on